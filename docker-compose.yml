services:
  postgres:
    image: postgres:17
    container_name: receipt_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receipt_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - receipt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipt_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  receipt_postgres_data:
